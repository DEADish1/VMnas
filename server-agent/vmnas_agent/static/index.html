<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VMnas</title>
    <style>
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f6f8; color: #17202a; }
      main { max-width: 980px; margin: 0 auto; padding: 28px; }
      header, section { background: #fff; border: 1px solid #d9dee6; border-radius: 8px; padding: 18px; margin-bottom: 16px; }
      h1, h2, p { margin: 0; }
      h1 { font-size: 32px; }
      h2 { font-size: 18px; margin-bottom: 12px; }
      p { color: #687383; margin-top: 8px; }
      input, button { font: inherit; min-height: 36px; border-radius: 8px; }
      input { border: 1px solid #d9dee6; padding: 7px 10px; width: min(100%, 360px); }
      button { border: 0; color: #fff; background: #2563eb; padding: 7px 12px; cursor: pointer; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e6eaf0; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .muted { color: #687383; }
      pre { white-space: pre-wrap; background: #111827; color: #d9e8ff; padding: 12px; border-radius: 8px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>VMnas</h1>
        <p>Browser control shell for paired devices.</p>
      </header>

      <section>
        <h2>Connection</h2>
        <div class="row">
          <input id="token" placeholder="Paired device token">
          <button id="save">Save Token</button>
          <button id="refresh">Refresh</button>
        </div>
        <p class="muted">Use the Mac client or pairing QR flow to get a paired-device token.</p>
      </section>

      <section>
        <h2>Virtual Machines</h2>
        <table>
          <thead><tr><th>ID</th><th>Name</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="vms"><tr><td colspan="4">Not loaded.</td></tr></tbody>
        </table>
      </section>

      <section>
        <h2>Status</h2>
        <pre id="status">Ready.</pre>
      </section>
    </main>
    <script>
      const tokenInput = document.querySelector("#token");
      const statusBox = document.querySelector("#status");
      const vmBody = document.querySelector("#vms");
      tokenInput.value = localStorage.getItem("vmnasToken") || "";

      function headers() {
        const token = tokenInput.value.trim();
        return token ? { "Authorization": `Bearer ${token}` } : {};
      }

      async function api(path, options = {}) {
        const response = await fetch(path, { ...options, headers: { ...headers(), ...(options.headers || {}) } });
        if (!response.ok) throw new Error(`${response.status} ${await response.text()}`);
        return response.json();
      }

      async function loadVMs() {
        try {
          const vms = await api("/vms");
          vmBody.innerHTML = vms.map(vm => `
            <tr>
              <td>${vm.vmid}</td>
              <td>${vm.name}</td>
              <td>${vm.status}</td>
              <td>
                <button onclick="vmAction(${vm.vmid}, 'start')">Start</button>
                <button onclick="vmAction(${vm.vmid}, 'shutdown')">Shutdown</button>
                <button onclick="vmAction(${vm.vmid}, 'stop')">Stop</button>
              </td>
            </tr>
          `).join("") || '<tr><td colspan="4">No VMs.</td></tr>';
          statusBox.textContent = "Loaded.";
        } catch (error) {
          statusBox.textContent = error.message;
        }
      }

      async function vmAction(vmid, action) {
        try {
          await api(`/vms/${vmid}/${action}`, { method: "POST" });
          await loadVMs();
        } catch (error) {
          statusBox.textContent = error.message;
        }
      }

      document.querySelector("#save").addEventListener("click", () => {
        localStorage.setItem("vmnasToken", tokenInput.value.trim());
        statusBox.textContent = "Token saved in this browser.";
      });
      document.querySelector("#refresh").addEventListener("click", loadVMs);
      loadVMs();
    </script>
  </body>
</html>
